telegram:
  backend: bot
  bot_token_env: TELEGRAM_BOT_TOKEN

accounts:
  - username_env: INSTAGRAM_USERNAME
    telegram_chat_id_env: TELEGRAM_CHAT_ID
    enabled: true
    check_limit: 6
    initial_skip: 6
    caption_template: |
      {caption}

      Link: {url}

apify:
  token_env: APIFY_TOKEN
  actor_id: apify/instagram-scraper
  timeout_seconds: 180
  max_results_per_run: 6
  monthly_result_cap: 1800
  billing_cycle_start_day: 26

settings:
  backend: apify
  state_file: data/state.json
  temp_dir: data/tmp
  request_timeout: 25
  post_delay_seconds: 4
  dry_run: false
