name: Instagram to Telegram

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "data/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "data/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without posting to Telegram"
        required: false
        default: false
        type: boolean
      initialize_only:
        description: "Mark current posts as processed without posting"
        required: false
        default: false
        type: boolean
      catch_up_hours:
        description: "Manual recovery window in hours (48-168); try dry_run first"
        required: false
        default: 48
        type: number
      resolve_action:
        description: "For uncertain Telegram deliveries (no posting)"
        required: false
        default: none
        type: choice
        options: [none, delivered, retry]
      resolve_username:
        description: "Instagram username when resolving an uncertain delivery"
        required: false
        type: string
      resolve_shortcode:
        description: "Instagram shortcode when resolving an uncertain delivery"
        required: false
        type: string
  schedule:
    # Inactive public repository schedules may be disabled after 60 days.
    # State-branch activity is not a verified workaround; see docs/SETUP.md.
    - cron: "17 */6 * * *"

concurrency:
  group: instagram-to-telegram-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  sync:
    if: (github.event_name == 'workflow_dispatch' && inputs.resolve_action != 'delivered' && inputs.resolve_action != 'retry') || (github.event_name == 'schedule' && (vars.ACCOUNTS_JSON != '' || (vars.INSTAGRAM_USERNAME != '' && vars.TELEGRAM_CHAT_ID != '')))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore persistent sync state
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m insta_tg_sync.github_state restore

      - name: Run sync
        id: sync
        env:
          # Public configuration: Settings -> Secrets and variables -> Actions -> Variables
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          # Optional multi-account JSON generated by the local setup wizard.
          ACCOUNTS_JSON: ${{ vars.ACCOUNTS_JSON }}
          MAX_ACCOUNTS_PER_RUN: ${{ vars.MAX_ACCOUNTS_PER_RUN }}
          # Optional Telegram destination for alerts after repeated failures.
          ALERT_CHAT_ID: ${{ vars.ALERT_CHAT_ID }}

          # Private credentials: Settings -> Secrets and variables -> Actions -> Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_CHECKPOINT_REMOTE: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args="--config config.example.yml"
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            args="$args --dry-run"
          fi
          if [ "${{ github.event.inputs.initialize_only || 'false' }}" = "true" ]; then
            args="$args --initialize-only"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.catch_up_hours }}" ]; then
            args="$args --catch-up-hours ${{ inputs.catch_up_hours }}"
          fi
          python -m insta_tg_sync.cli $args

      - name: Persist state
        if: ${{ always() && steps.restore.outcome == 'success' && steps.sync.outcome != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m insta_tg_sync.github_state persist

      - name: Usage and delivery summary
        if: ${{ always() && steps.restore.outcome == 'success' }}
        run: python -m insta_tg_sync.report


  resolve:
    if: github.event_name == 'workflow_dispatch' && (inputs.resolve_action == 'delivered' || inputs.resolve_action == 'retry')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Restore state
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m insta_tg_sync.github_state restore
      - name: Resolve one uncertain delivery
        id: resolve
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESOLVE_ACTION: ${{ inputs.resolve_action }}
          RESOLVE_USERNAME: ${{ inputs.resolve_username }}
          RESOLVE_SHORTCODE: ${{ inputs.resolve_shortcode }}
        run: python -m insta_tg_sync.reconcile
      - name: Persist reviewed state
        if: ${{ steps.restore.outcome == 'success' && steps.resolve.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m insta_tg_sync.github_state persist
