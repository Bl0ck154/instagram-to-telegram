name: Instagram to Telegram

on:
  push:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without posting to Telegram"
        required: false
        default: false
        type: boolean
      initialize_only:
        description: "Mark current posts as processed without posting"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: instagram-to-telegram-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  sync:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.INSTAGRAM_USERNAME != '' && vars.TELEGRAM_CHAT_ID != '')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run sync
        env:
          # Public configuration: Settings -> Secrets and variables -> Actions -> Variables
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}

          # Private credentials: Settings -> Secrets and variables -> Actions -> Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          args="--config config.example.yml"
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            args="$args --dry-run"
          fi
          if [ "${{ github.event.inputs.initialize_only || 'false' }}" = "true" ]; then
            args="$args --initialize-only"
          fi
          python -m insta_tg_sync.cli $args

      - name: Persist state
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/state.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/state.json
            git commit -m "Update sync state"
            git pull --rebase
            git push
          fi
