name: Production initialization smoke test

on:
  push:

permissions:
  contents: write

jobs:
  initialize:
    if: github.event.head_commit.message == 'Run production initialization smoke test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          if not token:
              raise SystemExit('TELEGRAM_BOT_TOKEN is missing')
          if not chat_id:
              raise SystemExit('TELEGRAM_CHAT_ID is missing')

          base = f'https://api.telegram.org/bot{token}'
          me = requests.get(f'{base}/getMe', timeout=30).json()
          if not me.get('ok'):
              raise SystemExit('Telegram bot token is invalid or unavailable')

          bot_id = me['result']['id']
          member = requests.get(
              f'{base}/getChatMember',
              params={'chat_id': chat_id, 'user_id': bot_id},
              timeout=30,
          ).json()
          if not member.get('ok'):
              raise SystemExit('Telegram bot cannot access the configured destination')
          status = member['result'].get('status')
          if status in {'left', 'kicked'}:
              raise SystemExit('Telegram bot is not a member of the configured destination')
          print('Telegram configuration OK')
          PY

      - name: Initialize Instagram state through Apify
        env:
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m insta_tg_sync.cli --config config.example.yml --initialize-only

      - name: Persist initialized state
        run: |
          if [ -n "$(git status --porcelain data/state.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/state.json
            git commit -m "Update sync state"
            git pull --rebase
            git push
          fi
