<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Instagram to Telegram automated repost illustration</title>
<desc id="desc">An Instagram photo post with caption is transferred by a scheduled sync into a Telegram channel.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1228"/><stop offset="1" stop-color="#141c37"/></linearGradient>
<linearGradient id="pink" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#fb7b63"/><stop offset=".5" stop-color="#db3c92"/><stop offset="1" stop-color="#8759ef"/></linearGradient>
<linearGradient id="sea" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#259cf0"/><stop offset="1" stop-color="#54d2ee"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="160%" height="180%"><feDropShadow dx="0" dy="11" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
</defs>
<rect width="1200" height="500" rx="28" fill="url(#bg)"/>
<circle cx="110" cy="40" r="170" fill="#dc488e" opacity=".07"/>
<circle cx="1140" cy="460" r="220" fill="#21b1f3" opacity=".07"/>
<text x="55" y="54" fill="#c7d4f4" font-size="18" font-family="Arial, sans-serif" letter-spacing="2">INSTAGRAM → TELEGRAM</text>
<text x="1125" y="54" fill="#8899bc" font-size="13" text-anchor="end" font-family="Arial, sans-serif">ILLUSTRATIVE OUTPUT</text>
<g filter="url(#shadow)">
<rect x="65" y="86" width="390" height="336" rx="20" fill="#fff"/>
<rect x="65" y="86" width="390" height="64" rx="20" fill="#fff"/>
<rect x="87" y="104" width="34" height="34" rx="11" fill="url(#pink)"/>
<circle cx="104" cy="121" r="8" fill="none" stroke="#fff" stroke-width="2"/>
<circle cx="114" cy="111" r="2" fill="#fff"/>
<text x="136" y="126" fill="#26354f" font-size="19" font-weight="bold" font-family="Arial, sans-serif">@your_instagram</text>
<rect x="80" y="158" width="360" height="183" rx="12" fill="#f0e2db"/>
<circle cx="350" cy="198" r="33" fill="#f9bd7f"/>
<path d="M80 305L180 214L260 285L317 232L440 339H80Z" fill="#71a993"/>
<path d="M80 338L188 258L242 316L300 280L440 341H80Z" fill="#426e72"/>
