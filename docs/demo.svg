<text x="84" y="401" fill="#79839c" font-size="14" font-family="Arial, sans-serif">Photo · Caption · Original URL</text>
</g>
<g>
<rect x="478" y="207" width="235" height="82" rx="18" fill="#232f53" stroke="#4a587a" stroke-width="1.5"/>
<text x="595" y="238" fill="#eaf3ff" text-anchor="middle" font-size="15" font-weight="bold" font-family="Arial, sans-serif">GitHub Actions</text>
<text x="595" y="263" fill="#a5bae4" text-anchor="middle" font-size="14" font-family="Arial, sans-serif">Scheduled sync</text>
<path d="M458 248H477M713 248H734" stroke="#67c8f8" stroke-width="3" stroke-linecap="round"/>
<path d="M729 242L736 248L729 254" fill="none" stroke="#67c8f8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g filter="url(#shadow)">
<rect x="744" y="86" width="390" height="336" rx="20" fill="#fff"/>
<rect x="744" y="86" width="390" height="64" rx="20" fill="#eef7fd"/>
<circle cx="784" cy="118" r="20" fill="url(#sea)"/>
<path d="M772 119L796 108L789 131L783 124L778 129L778 121Z" fill="#fff"/>
<text x="817" y="126" fill="#173957" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Your Telegram channel</text>
<rect x="765" y="166" width="348" height="171" rx="12" fill="#d7ede6"/>
<circle cx="1020" cy="201" r="31" fill="#f7ba7b"/>
<path d="M765 307L868 229L930 284L990 233L1113 338H765Z" fill="#6ca894"/>
<path d="M765 337L875 262L927 313L987 281L1113 339H765Z" fill="#406e71"/>
